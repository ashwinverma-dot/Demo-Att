name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install validation dependencies
        run: |
          python3 -m pip install html5lib cssutils

      - name: Validate HTML structure
        run: |
          python3 - <<'PY'
from html5lib import parse
from pathlib import Path
content = Path('index.html').read_text(encoding='utf-8')
parse(content)
print('HTML structure parse complete')
PY

      - name: Validate CSS syntax
        run: |
          python3 - <<'PY'
import cssutils
from pathlib import Path

css = Path('styles.css').read_text(encoding='utf-8')
parser = cssutils.CSSParser(loglevel='WARNING')
parser.parseString(css)
print('CSS parse complete')
PY

      - name: Check file presence
        run: |
          test -f index.html
          test -f styles.css
