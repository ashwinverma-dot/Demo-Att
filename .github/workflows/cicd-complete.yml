name: Complete CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Unit Tests - Link Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install cheerio

      - name: Run link validation tests
        run: node test-links.js

      - name: Validate HTML structure
        run: |
          npm install html5lib
          python3 - <<'PY'
          from html5lib import parse
          from pathlib import Path
          content = Path('index.html').read_text(encoding='utf-8')
          parse(content)
          print('✓ HTML structure is valid')
          PY

      - name: Validate CSS syntax
        run: |
          npm install cssutils
          python3 - <<'PY'
          import cssutils
          from pathlib import Path
          css = Path('styles.css').read_text(encoding='utf-8')
          parser = cssutils.CSSParser(loglevel='WARNING')
          parser.parseString(css)
          print('✓ CSS syntax is valid')
          PY

      - name: Check required files exist
        run: |
          test -f index.html && echo "✓ index.html found"
          test -f styles.css && echo "✓ styles.css found"
          test -f Dockerfile && echo "✓ Dockerfile found"
          test -f nginx.conf && echo "✓ nginx.conf found"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image successfully built with digest: ${{ steps.docker_build.outputs.digest }}"

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v1

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test, build, deploy]
    if: always()

    steps:
      - name: Check workflow status
        run: |
          echo "✅ All CI/CD stages completed!"
          echo ""
          echo "📊 Job Status Summary:"
          echo "  • Unit Tests: ${{ needs.test.result }}"
          echo "  • Docker Build: ${{ needs.build.result }}"
          echo "  • GitHub Pages Deploy: ${{ needs.deploy.result }}"
          echo ""
          echo "🔗 Application URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Report failure
        if: failure()
        run: |
          echo "❌ CI/CD Pipeline Failed!"
          echo "Review the logs above for details."
          exit 1
